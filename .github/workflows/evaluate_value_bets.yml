name: Evaluate Value Bets

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'  # Läuft automatisch alle 30 Minuten rund um die Uhr

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy supabase requests

      - name: Run Value Engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python evaluate_value_bets.py
