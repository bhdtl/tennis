name: Evaluate Value Bets

on:
  workflow_dispatch: # Manuelles Ausführen über den Actions-Tab
  schedule:
    - cron: '0 */4 * * *' # Läuft automatisch alle 4 Stunden (optional)

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy supabase requests

      - name: Value-Bet-Analyse ausführen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python evaluate_value_bets.py
