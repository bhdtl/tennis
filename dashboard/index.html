<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tennis Value Signals | Live Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 border-b border-slate-800 pb-6">
            <div>
                <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500">
                    🎾 Tennis Value Engine
                </h1>
                <p class="text-slate-400 text-sm mt-1">Live Opening & Surface-Aware Edge Signals</p>
            </div>
            <div class="flex items-center gap-3">
                <span id="status-badge" class="px-3 py-1 text-xs font-semibold rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    Live Signals
                </span>
                <button onclick="loadSignals()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-lg text-sm font-medium border border-slate-700 transition">
                    🔄 Aktualisieren
                </button>
            </div>
        </header>

        <!-- Key Metrics Banner -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-slate-800/50 border border-slate-800 p-4 rounded-xl">
                <div class="text-slate-400 text-xs font-medium uppercase tracking-wider">Aktive Signals</div>
                <div id="metric-count" class="text-2xl font-bold mt-1 text-white">-</div>
            </div>
            <div class="bg-slate-800/50 border border-slate-800 p-4 rounded-xl">
                <div class="text-slate-400 text-xs font-medium uppercase tracking-wider">Ø Erwartungswert (+EV)</div>
                <div id="metric-avgev" class="text-2xl font-bold mt-1 text-emerald-400">-</div>
            </div>
            <div class="bg-slate-800/50 border border-slate-800 p-4 rounded-xl">
                <div class="text-slate-400 text-xs font-medium uppercase tracking-wider">Top Belag heute</div>
                <div id="metric-surface" class="text-2xl font-bold mt-1 text-cyan-400">-</div>
            </div>
        </div>

        <!-- Signals Table / Cards Grid -->
        <div id="signals-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Dynamic Content -->
            <div class="col-span-full text-center py-12 text-slate-500">Lade Signale aus Supabase...</div>
        </div>
    </div>

    <script>
        // TRAGE HIER DEINE SUPABASE CONFIG EIN:
        const SUPABASE_URL = "DEINE_SUPABASE_URL";
        const SUPABASE_ANON_KEY = "DEIN_SUPABASE_ANON_KEY";

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadSignals() {
            const container = document.getElementById("signals-container");
            container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">Scanne Märkte...</div>`;

            // Nur zukünftige oder heutige Spiele abfragen
            const todayStr = new Date().toISOString().split('T')[0];

            const { data: signals, error } = await _supabase
                .from('value_signals')
                .select('*')
                .gte('event_date', todayStr)
                .order('event_date', { ascending: true });

            if (error || !signals || signals.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full bg-slate-800/30 border border-slate-800 rounded-xl p-8 text-center text-slate-400">
                        Keine aktiven Value Bets für die nächsten Ansetzungen gefunden.
                    </div>`;
                document.getElementById("metric-count").innerText = "0";
                document.getElementById("metric-avgev").innerText = "0.0%";
                document.getElementById("metric-surface").innerText = "N/A";
                return;
            }

            // Metrics Berechnen
            document.getElementById("metric-count").innerText = signals.length;
            const avgEv = (signals.reduce((acc, s) => acc + s.expected_value, 0) / signals.length * 100).toFixed(1);
            document.getElementById("metric-avgev").innerText = `+${avgEv}%`;
            
            const surfaces = signals.map(s => s.surface);
            const topSurface = surfaces.sort((a,b) => surfaces.filter(v => v===a).length - surfaces.filter(v => v===b).length).pop();
            document.getElementById("metric-surface").innerText = topSurface || "Hard";

            // HTML Rendern
            container.innerHTML = signals.map(sig => {
                const evPercent = (sig.expected_value * 100).toFixed(1);
                const modelProb = (sig.model_prob * 100).toFixed(1);
                const marketProb = (sig.market_prob * 100).toFixed(1);

                return `
                <div class="bg-slate-800/60 border border-slate-700/60 hover:border-emerald-500/40 transition rounded-xl p-5 shadow-lg relative overflow-hidden">
                    <div class="absolute top-0 right-0 bg-emerald-500/10 text-emerald-400 border-l border-b border-emerald-500/20 px-3 py-1 rounded-bl-lg text-xs font-bold">
                        +${evPercent}% EV
                    </div>
                    
                    <div class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
                        ${sig.tournament_name} • <span class="text-cyan-400">${sig.surface}</span>
                    </div>

                    <div class="text-lg font-bold text-slate-100 mb-3">
                        ${sig.player_home} <span class="text-slate-500 text-sm">vs</span> ${sig.player_away}
                    </div>

                    <div class="bg-slate-900/80 rounded-lg p-3 border border-slate-800 mb-4 flex justify-between items-center">
                        <div>
                            <div class="text-xs text-slate-400">Empfohlener Pick</div>
                            <div class="text-base font-extrabold text-emerald-400">${sig.recommended_pick}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-xs text-slate-400">Neo.bet Quote</div>
                            <div class="text-xl font-black text-white">${sig.odds}</div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2 text-xs text-slate-400 pt-2 border-t border-slate-800">
                        <div>Modell-Wahrscheinlichkeit: <b class="text-slate-200">${modelProb}%</b></div>
                        <div class="text-right">Markt-Implied: <b class="text-slate-200">${marketProb}%</b></div>
                    </div>

                    <div class="mt-3 text-[10px] text-slate-500 flex justify-between">
                        <span>Datum: ${sig.event_date} ${sig.event_time || ''}</span>
                        ${sig.is_opening_line ? '<span class="text-amber-400 font-semibold">⚡ Opening Line</span>' : ''}
                    </div>
                </div>
                `;
            }).join('');
        }

        // Beim Laden ausführen
        loadSignals();
    </script>
</body>
</html>
